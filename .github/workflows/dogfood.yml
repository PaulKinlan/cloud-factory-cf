name: Cloud Factory Dogfood Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood-review:
    name: Agent PR Review & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Run Self-Hosted PR Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/cli/dist/bin.js review \
            --event "$GITHUB_EVENT_PATH" \
            --out "$GITHUB_STEP_SUMMARY"

  dogfood-pipeline-simulation:
    name: Dual-Runtime Pipeline Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # packages/cli's exec_command sandbox needs bubblewrap, which the runner image does
      # not ship: without it `npm run ci` fails on local-tools.test.ts before any review
      # runs, so every pull request carried a red gate (cloud-factory-cf-n2h0).
      - name: Install bubblewrap (CLI sandbox)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Monorepo CI Quality Gate
        run: npm run ci
